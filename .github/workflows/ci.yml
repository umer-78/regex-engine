name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Every engine agrees
        run: |
          rex match 'a+b'        'xaaab'
          rex match '^\d+\.\d+$' '3.14159'
          rex groups '(\w+)@(\w+)' 'mail user@example now'
          rex compile 'a(b|c)*d'
      - name: The explosion, measured
        run: |
          rex redos -m 20 --stdlib
          rex redos 'a+b+c' -u ab -m 12
      - name: The static check finds the known shapes
        run: |
          rex check 'a+b+c' '^\w+@\w+\.\w+$' '[a-z]+[0-9]+' '(?:ab)+c'
          if rex check '(a+)+b'; then echo "a vulnerable pattern must exit non-zero"; exit 1; fi
      - name: Where the lazy DFA wins and loses
        run: rex bench -n 20000
